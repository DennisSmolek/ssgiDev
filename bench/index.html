<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSGI Bench</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #101014; color: #e8e8ea;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #error { position: fixed; inset: 0; display: none; place-content: center;
        padding: 2rem; text-align: center; }
      #error.show { display: grid; }
      #error h1 { color: #ff6b6b; font-size: 1.1rem; }
      #error pre { text-align: left; white-space: pre-wrap; max-width: 720px;
        margin: 1rem auto; opacity: 0.8; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="error"><div><h1>WebGPU unavailable</h1><pre id="error-msg"></pre></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
